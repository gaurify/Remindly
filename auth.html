<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Log in — Remindly</title>
    <meta name="description" content="Log in or create your Remindly account.">
    <meta name="theme-color" content="#211f1e">

    <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Remindly">
    <link rel="stylesheet" href="css/app.css">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { background: "#fcfaf6", dark: "#211f1e", accent: "#ef4444" }
                }
            }
        }
    </script>

    <style>
        body {
            margin: 0;
            background: #211f1e;
            color: #fcfaf6;
            -webkit-font-smoothing: antialiased;
        }
    </style>
</head>

<body class="min-h-screen flex flex-col">

    <header class="w-full px-6 sm:px-10 py-6">
        <a href="index.html" class="inline-flex items-center gap-3" aria-label="Remindly home">
            <img src="assets/logo.svg" alt="Remindly logo" class="w-9 h-9">
            <span class="text-lg font-bold tracking-tight">Remindly</span>
        </a>
    </header>

    <main class="flex-1 flex items-center justify-center px-6 pb-16">
        <div class="w-full max-w-sm">

            <h1 id="auth-title" class="text-3xl font-extrabold tracking-tight text-center">Welcome back</h1>
            <p id="auth-subtitle" class="mt-2 text-sm text-white/60 text-center">
                Log in to keep your hydration streak going.
            </p>

            <form id="auth-form" class="mt-8 space-y-4" novalidate>

                <div>
                    <label for="email" class="block text-sm font-semibold mb-1.5">Email</label>
                    <input
                        id="email"
                        type="email"
                        required
                        autocomplete="email"
                        class="w-full rounded-xl bg-white/5 border border-white/10 px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-accent"
                        placeholder="you@example.com"
                    >
                </div>

                <div>
                    <label for="password" class="block text-sm font-semibold mb-1.5">Password</label>
                    <input
                        id="password"
                        type="password"
                        required
                        minlength="6"
                        autocomplete="current-password"
                        class="w-full rounded-xl bg-white/5 border border-white/10 px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-accent"
                        placeholder="At least 6 characters"
                    >
                </div>

                <p id="auth-error" class="text-sm min-h-[1.25rem] text-red-400" role="alert"></p>

                <button
                    id="submit-btn"
                    type="submit"
                    class="w-full bg-accent text-white font-bold py-3 rounded-xl hover:bg-red-600 transition"
                >
                    Log in
                </button>

            </form>

            <button
                id="mode-toggle"
                type="button"
                class="mt-5 w-full text-sm text-white/60 hover:text-white transition text-center"
            >
                Need an account? Sign up
            </button>

        </div>
    </main>

    <script type="module" src="js/auth.js"></script>
    <script src="js/register-sw.js"></script>
</body>
</html>
